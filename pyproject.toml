[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifest-gate"
version = "0.2.0"
description = "Pre-merge policy gate for Kubernetes manifests in GitOps repositories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
manifest-gate = "manifest_gate.check:main"

[tool.setuptools]
packages = ["manifest_gate"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["manifest_gate", "test_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
