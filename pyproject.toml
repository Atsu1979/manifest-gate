[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manifest-gate"
version = "0.1.0"
description = "Pre-merge policy gate for Kubernetes manifests in GitOps repositories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
manifest-gate = "manifest_gate.check:main"

[tool.setuptools]
packages = ["manifest_gate"]
